<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ahorra y Corre - Modo Experto</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            width: 900px;
            height: 500px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            border: 6px solid #444;
            border-radius: 4px;
            background: #000;
            overflow: hidden;
        }
        canvas { display: block; }
        
        /* BARRA DE PROGRESO VISUAL */
        #progressContainer {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 25px;
            background: rgba(0,0,0,0.6);
            border: 2px solid white;
            border-radius: 15px;
            z-index: 5;
            overflow: hidden;
        }
        #progressBar {
            width: 25%; /* Empieza en 500 de 2000 */
            height: 100%;
            background: linear-gradient(90deg, #f1c40f, #2ecc71);
            transition: width 0.3s ease-out;
            box-shadow: 0 0 10px #2ecc71;
        }
        #progressText {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 2px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            text-shadow: 1px 1px 0 #000;
        }

        /* HUD SUPERIOR */
        #uiLayer {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between;
            color: white; font-weight: 900; font-size: 22px;
            text-shadow: 2px 2px 0 #000; pointer-events: none; z-index: 6;
        }
        .stat-box { 
            background: rgba(0,0,0,0.7); padding: 5px 15px; 
            border-radius: 10px; border: 2px solid #fff; 
        }
        
        /* PANTALLAS */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; z-index: 10; text-align: center;
        }
        h1 { font-size: 60px; margin: 0 0 10px 0; color: #ffd700; text-shadow: 4px 4px 0 #d35400; }
        p { font-size: 20px; margin-bottom: 20px; max-width: 600px; line-height: 1.4; }
        
        button {
            padding: 15px 40px; font-size: 24px; font-weight: bold;
            background: linear-gradient(to bottom, #2ecc71, #27ae60); 
            color: white; border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 6px 0 #1e8449;
            transition: all 0.1s;
        }
        button:hover { transform: scale(1.05); filter: brightness(1.2); }
        button:active { transform: translateY(6px); box-shadow: none; }
        .hidden { display: none !important; }
        
        .tutorial-key {
            display: inline-block;
            background: #eee; color: #333;
            padding: 2px 8px; border-radius: 4px;
            font-family: monospace; font-weight: bold;
            box-shadow: 0 2px 0 #999;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <audio id="bgMusic" loop>
        <source src="assets/musica/musica.mp3" type="audio/mpeg">
    </audio>

    <!-- Barra de Progreso Visual -->
    <div id="progressContainer">
        <div id="progressBar"></div>
        <div id="progressText">AHORROS: $500 / $2000</div>
    </div>

    <div id="uiLayer">
        <div class="stat-box">💰 $<span id="scoreVal">500</span></div>
    </div>

    <div id="startScreen" class="screen">
        <h1>AHORRA Y CORRE</h1>
        <p>
            ⬆️ <b>SALTA</b> los gastos del suelo (Cafés, Tarifas)<br>
            ⬇️ <b>AGÁCHATE</b> para pasar bajo los obstáculos aéreos<br>
            💲 ¡Recoge todas las monedas posibles!
        </p>
        <button onclick="startGame()">▶ JUGAR AHORA</button>
    </div>

    <div id="gameOverScreen" class="screen hidden">
        <h1 id="endTitle">GAME OVER</h1>
        <p id="endMessage">Mensaje</p>
        <button onclick="resetGame()">🔄 REINTENTAR</button>
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>
</div>

<script>
    // --- RUTAS DE IMÁGENES ---
    const imgBg = new Image(); imgBg.src = "assets/imagenes/background.png";
    const imgPlayer = new Image(); imgPlayer.src = "assets/imagenes/player.png";
    const imgCoin = new Image(); imgCoin.src = "assets/imagenes/coin.png";
    const imgObs = new Image(); imgObs.src = "assets/imagenes/obstacle.png"; // Usaremos esta para suelo y aire
    const imgGoal = new Image(); imgGoal.src = "assets/imagenes/goal.png";
    
    const audio = document.getElementById('bgMusic');
    audio.volume = 0.3;

    // --- VARIABLES ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let gameRunning = false;
    let frameCount = 0;
    let score = 500;
    const goal = 2000;
    let gameSpeed = 6;
    let bgX = 0;
    let lastSpawnX = 900;

    // Jugador
    const player = { 
        x: 100, y: 300, w: 80, h: 100, 
        dy: 0, jumpPower: -14, gravity: 0.8, 
        grounded: false, ducking: false, originalH: 100 
    };

    let obstacles = [];
    let coins = [];
    let particles = [];
    let floatingTexts = [];

    // --- CONTROLES ---
    document.addEventListener('keydown', (e) => {
        if (!gameRunning) return;
        if (e.code === 'ArrowUp' && player.grounded) {
            player.dy = player.jumpPower;
            player.grounded = false;
            createParticles(player.x + 40, player.y + 100, '#fff', 5);
        }
        if (e.code === 'ArrowDown') {
            if (!player.ducking) {
                player.ducking = true;
                player.h = player.originalH / 2;
                player.y += player.originalH / 2;
            }
        }
    });

    document.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowDown') {
            player.ducking = false;
            player.y -= player.originalH / 2;
            player.h = player.originalH;
        }
    });

    // --- LÓGICA DE SPAWN INTELIGENTE ---
    function spawnManager() {
        // Distancia mínima entre objetos para que no sea imposible
        let minDistance = 300 + Math.random() * 150; 

        if (lastSpawnX < canvas.width - minDistance) {
            
            // 1. SIEMPRE generamos un grupo de monedas (Lluvia de monedas)
            // A veces 1, a veces 3 en línea
            let coinCount = Math.random() > 0.7 ? 3 : 1;
            for(let i=0; i<coinCount; i++) {
                // Monedas pueden estar en el suelo o en el aire (para saltar)
                let yPos = Math.random() > 0.5 ? 220 : 360;
                coins.push({ x: canvas.width + (i*60), y: yPos, w: 50, h: 50 });
            }

            // 2. DECIDIR EL OBSTÁCULO (Para forzar habilidades)
            let rand = Math.random();
            
            if (rand < 0.4) {
                // 40% Probabilidad: Obstáculo AÉREO (Obliga a AGACHARSE)
                // Lo ponemos a altura de cabeza (y=280 aprox)
                obstacles.push({ x: canvas.width + 100, y: 260, w: 70, h: 70, type: 'air' });
            } else {
                // 60% Probabilidad: Obstáculo de SUELO (Obliga a SALTAR)
                obstacles.push({ x: canvas.width + 100, y: 360, w: 60, h: 60, type: 'ground' });
            }
            
            lastSpawnX = canvas.width;
        }
    }

    function update() {
        // Velocidad progresiva
        if (frameCount % 600 === 0) gameSpeed += 0.5;

        // Física Jugador
        player.dy += player.gravity;
        player.y += player.dy;

        if (player.y + player.h > 450) {
            player.y = 450 - player.h;
            player.dy = 0;
            player.grounded = true;
        } else { player.grounded = false; }

        bgX -= gameSpeed * 0.5;
        if (bgX <= -canvas.width) bgX = 0;

        // Actualizar Obstáculos
        for (let i = 0; i < obstacles.length; i++) {
            let obs = obstacles[i];
            obs.x -= gameSpeed;
            
            if (checkCollision(player, obs)) {
                score -= 50; 
                createParticles(obs.x + 30, obs.y + 30, '#e74c3c', 15);
                addFloatingText("-$50", player.x, player.y, "red");
                obstacles.splice(i, 1); i--; 
                
                // Efecto de temblor
                canvas.style.transform = `translate(${Math.random()*10-5}px, ${Math.random()*10-5}px)`;
                setTimeout(() => canvas.style.transform = "none", 50);

                checkGameOver();
            }
        }

        // Actualizar Monedas
        for (let i = 0; i < coins.length; i++) {
            let coin = coins[i];
            coin.x -= gameSpeed;

            if (checkCollision(player, coin)) {
                score += 100; 
                createParticles(coin.x + 25, coin.y + 25, '#f1c40f', 10);
                addFloatingText("+$100", player.x, player.y, "#2ecc71");
                coins.splice(i, 1); i--; 
                checkWin();
            }
        }

        // Textos flotantes
        for (let i = 0; i < floatingTexts.length; i++) {
            let ft = floatingTexts[i];
            ft.y -= 1.5; ft.life--;
            if(ft.life <= 0) { floatingTexts.splice(i, 1); i--; }
        }

        // Partículas
        for (let i = 0; i < particles.length; i++) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.life--;
            if(p.life <= 0) { particles.splice(i, 1); i--; }
        }

        lastSpawnX -= gameSpeed;
        spawnManager(); 
        updateUI(); 
        frameCount++;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. FONDO
        if (imgBg.complete && imgBg.naturalWidth !== 0) {
            ctx.drawImage(imgBg, bgX, 0, canvas.width, canvas.height);
            ctx.drawImage(imgBg, bgX + canvas.width, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = "#2c3e50"; ctx.fillRect(0,0,canvas.width, canvas.height);
        }

        // 2. SUELO
        ctx.fillStyle = "#222"; ctx.fillRect(0, 450, canvas.width, 50);
        ctx.fillStyle = "#f1c40f"; 
        let stripeOffset = (frameCount * gameSpeed) % 60;
        for(let i=-1; i<20; i++) {
            ctx.beginPath();
            ctx.moveTo(i*60 - stripeOffset, 450);
            ctx.lineTo(i*60 + 30 - stripeOffset, 500);
            ctx.lineTo(i*60 + 10 - stripeOffset, 500);
            ctx.lineTo(i*60 - 20 - stripeOffset, 450);
            ctx.fill();
        }

        // 3. JUGADOR
        let bounce = (player.grounded && !player.ducking) ? Math.sin(frameCount * 0.5) * 5 : 0;
        if (imgPlayer.complete && imgPlayer.naturalWidth !== 0) {
            // Si está agachado, no aplicamos rebote de corrida
            ctx.drawImage(imgPlayer, player.x, player.y + (player.ducking?0:bounce), player.w, player.h);
        } else {
            ctx.fillStyle = player.ducking ? "#e67e22" : "orange"; 
            ctx.fillRect(player.x, player.y + (player.ducking?0:bounce), player.w, player.h);
        }

        // 4. OBSTÁCULOS
        obstacles.forEach(obs => {
            if (imgObs.complete && imgObs.naturalWidth !== 0) {
                // Si es aéreo, podríamos rotarlo o cambiarlo, pero usaremos la misma imagen por ahora
                ctx.drawImage(imgObs, obs.x, obs.y, obs.w, obs.h);
                
                // Indicador visual si es aéreo (una línea punteada abajo)
                if(obs.type === 'air') {
                    ctx.strokeStyle = "rgba(255,255,255,0.3)";
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.moveTo(obs.x + obs.w/2, obs.y + obs.h);
                    ctx.lineTo(obs.x + obs.w/2, 450);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            } else {
                ctx.fillStyle = obs.type === 'air' ? "#8e44ad" : "red"; // Morado para aéreos, Rojo suelo
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            }
        });

        // 5. MONEDAS
        coins.forEach(coin => {
            if (imgCoin.complete && imgCoin.naturalWidth !== 0) ctx.drawImage(imgCoin, coin.x, coin.y, coin.w, coin.h);
            else { ctx.fillStyle = "#2ecc71"; ctx.beginPath(); ctx.arc(coin.x+25, coin.y+25, 25, 0, Math.PI*2); ctx.fill(); }
        });

        // 6. TEXTOS FLOTANTES
        floatingTexts.forEach(ft => {
            ctx.fillStyle = ft.color;
            ctx.font = "bold 30px Arial";
            ctx.strokeStyle = "black";
            ctx.lineWidth = 3;
            ctx.strokeText(ft.text, ft.x, ft.y);
            ctx.fillText(ft.text, ft.x, ft.y);
        });

        // 7. PARTÍCULAS
        particles.forEach(p => {
            ctx.fillStyle = p.color; 
            ctx.globalAlpha = p.life / 20;
            ctx.fillRect(p.x, p.y, p.size, p.size);
            ctx.globalAlpha = 1;
        });
    }

    function loop() {
        if (!gameRunning) return;
        update(); draw(); requestAnimationFrame(loop);
    }

    // --- UTILIDADES ---
    function checkCollision(r1, r2) {
        let padding = 10; // Hitbox ajustada
        return (r1.x < r2.x + r2.w - padding && r1.x + r1.w > r2.x + padding &&
                r1.y < r2.y + r2.h - padding && r1.y + r1.h > r2.y + padding);
    }

    function createParticles(x, y, color, count) {
        for(let i=0; i<count; i++) {
            particles.push({ 
                x: x, y: y, 
                vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8, 
                life: 20 + Math.random()*10, size: 4 + Math.random()*4, color: color 
            });
        }
    }

    function addFloatingText(text, x, y, color) {
        floatingTexts.push({ text: text, x: x, y: y, color: color, life: 40 });
    }

    function updateUI() {
        document.getElementById('scoreVal').innerText = score;
        
        // Actualizar Barra de Progreso
        let percentage = Math.min((score / goal) * 100, 100);
        document.getElementById('progressBar').style.width = percentage + "%";
        document.getElementById('progressText').innerText = `AHORROS: $${score} / $${goal}`;
    }
    
    function checkGameOver() { 
        if (score <= 0) {
            audio.pause();
            endGame("¡BANCARROTA!", "Gastaste todo. Recuerda esquivar los gastos."); 
        } 
    }
    
    function checkWin() { 
        if (score >= goal) {
            audio.pause();
            endGame("¡META LOGRADA!", "¡Has llenado tu alcancía! Eres un genio financiero."); 
        } 
    }
    
    function endGame(title, msg) {
        gameRunning = false;
        document.getElementById('endTitle').innerText = title;
        document.getElementById('endTitle').style.color = title.includes("BANCARROTA") ? "#e74c3c" : "#2ecc71";
        document.getElementById('endMessage').innerText = msg;
        document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    function startGame() {
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden');
        audio.currentTime = 0;
        audio.play().catch(e => console.log("Audio autoplay bloqueado"));
        resetVariables();
        gameRunning = true;
        loop();
    }

    function resetVariables() {
        score = 500; gameSpeed = 6; obstacles = []; coins = []; 
        particles = []; floatingTexts = []; lastSpawnX = 900;
        player.y = 300; player.dy = 0; 
        updateUI();
    }
    
    function resetGame() { startGame(); }

</script>
</body>
</html>
